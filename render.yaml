services:
  - type: web
    name: chess-ml-coach
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    # Every setting is configured in the Render dashboard (see
    # docs/hosted-browser-analysis-runbook.md); secrets never belong in this file.
