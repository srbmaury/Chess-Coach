services:
  - type: web
    name: chess-ml-coach
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: CHESS_COACH_USERNAME
        value: srbmaury
      - key: CHESS_COACH_STOCKFISH_DEPTH
        value: "14"
      # Hosted browser analysis stays off until an explicit canary (see
      # docs/hosted-browser-analysis-runbook.md). Secrets are set in the dashboard only.
      - key: CHESS_COACH_HOSTED_BROWSER_ANALYSIS_ENABLED
        value: "false"
