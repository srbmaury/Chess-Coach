[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-ml-coach"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "chess>=1.11.2,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "numpy>=2,<3",
  "lightgbm>=4.5,<5",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "markdown>=3.7,<4",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pyjwt>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]

[project.scripts]
chess-coach = "chess_ml_coach.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
